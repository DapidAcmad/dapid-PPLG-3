<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contoh Gambar di HTML</title>
</head>
<body>
  <h1>Style Gambar di HTML</h1>
  <p>Berikut ini adalah gambar singa:</p>
  <p>
    <img src="WhatsApp Image 2026-09-03 at 11.35.25.jpeg" style="width: 260px;border: 3px solid red;" />
    <img src="WhatsApp Image 2026-09-03 at 11.35.25.jpeg" style="width: 360px;border-radius: 10px;" />
    <img src="WhatsApp Image 2026-09-03 at 11.35.25.jpeg" style="width: 200px;height: 200px;border-radius: 100%;" />
  </p>
</body>
</html>
